name: Refresh league site

on:
  schedule:
    # Monday 10:00 UTC = 5:00 AM Central during the MLB season (CDT, UTC-5).
    - cron: "0 10 * * 1"
  workflow_dispatch:   # also run on demand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas openpyxl scikit-learn requests
      - name: Build site from ESPN
        run: python generate_site.py espn      # public league id baked into the script
      - name: Package site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
